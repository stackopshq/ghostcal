# ghostcal CI, ported from .github/workflows/ci.yml (run by Gitea Actions)
# when the repository moved to GitLab. The reasons written there are carried
# over with the steps they justify.
#
# Every job runs on the group's own runners (core-run-03/04, rootless podman,
# tag `linux`), each in a throwaway container: services (postgres) live on the
# job's own network (FF_NETWORK_PER_BUILD), reached by name, no host port.
#
# main publishes ghcr.io/stackopshq/ghostcal:sha-<short> and :main, as before,
# once Trivy finds no fixable HIGH/CRITICAL in either image (the frontend image
# is built and scanned, not published). apollo-platform pins the sha tag, so
# publishing deploys nothing. Credentials: GHCR_USERNAME / GHCR_TOKEN,
# protected group variables.
#
# Schedules are told apart by their description (the project allows no
# pipeline variables): "Weekly security", "Weekly renovate".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # No branch pipeline on top of an MR pipeline for the same commit.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - security
  - publish

default:
  tags: [linux]
  interruptible: true
  timeout: 20m

variables:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.11.8-python3.14-trixie
  NODE_IMAGE: docker.io/library/node:22-bookworm-slim
  DEBIAN_IMAGE: docker.io/library/debian:trixie-slim
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.3.6
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43.5
  TRIVY_VERSION: "0.76.2"
  # Pinned: a floating version makes a green job depend on an upstream
  # release. The one apps/mobile was developed and measured on.
  FLUTTER_VERSION: "3.47.2"
  FLUTTER_SHA256: 447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185
  GHCR_IMAGE: ghcr.io/stackopshq/ghostcal
  UV_CACHE_DIR: /tmp/uv-cache
  UV_LINK_MODE: copy

.code:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.security:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION != "Weekly security"
      when: never
    - when: on_success

# Two thirds of the backend suite is integration tests, and without a database
# they skip, which CI reports as success. RLS, invitations and key rotation
# are only covered here.
quality:
  stage: verify
  extends: [.code]
  image: $UV_IMAGE
  services:
    - name: docker.io/library/postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ghostcal
    POSTGRES_PASSWORD: ci-admin-password
    POSTGRES_DB: ghostcal
    GHOSTCAL_DATABASE_ADMIN_URL: postgresql+asyncpg://ghostcal:ci-admin-password@postgres:5432/ghostcal
    GHOSTCAL_DATABASE_URL: postgresql+asyncpg://ghostcal_app:ci-app-password@postgres:5432/ghostcal
    # Stays on localhost on purpose: no Redis service, nothing connects to it;
    # tests/conftest.py only needs a value for configuration validation.
    GHOSTCAL_REDIS_URL: redis://localhost:6379/0
    # Throwaway values for a throwaway database. `environment` stays
    # development, so the placeholder-secret validator does not apply.
    GHOSTCAL_SECRET_KEY: ci-secret-key-at-least-32-characters-long # gitleaks:allow
    GHOSTCAL_TOKEN_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars-long # gitleaks:allow
    # Skipping the integration tests here would be a green build that tested
    # none of them.
    GHOSTCAL_TESTS_REQUIRE_DB: "1"
    PGPASSWORD: ci-admin-password
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    - uv sync --frozen
    - |
      ok=0
      for _ in $(seq 1 90); do
        if psql -h postgres -U ghostcal -d ghostcal -tAc 'SELECT 1' >/dev/null 2>&1; then ok=$((ok+1)); else ok=0; fi
        [ "$ok" -ge 3 ] && break
        sleep 1
      done
      [ "$ok" -ge 3 ] || { echo "postgres did not start"; exit 1; }
    # Order matters, and mirrors compose: the role exists before the schema.
    # Migrations grant EXECUTE on their SECURITY DEFINER functions only IF
    # EXISTS (role ghostcal_app); migrating first silently skips those grants.
    - psql "postgresql://ghostcal:ci-admin-password@postgres:5432/ghostcal" -v app_password="ci-app-password" -f scripts/bootstrap_roles.sql
    - uv run alembic upgrade head
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv run pytest

frontend:
  stage: verify
  extends: [.code]
  image: $NODE_IMAGE
  cache:
    key:
      prefix: npm
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run type-check
    - npm test
    - npm run build
    - |
      css=$(find .next -name '*.css' -path '*static*' | head -1)
      test -n "$css" || { echo "no stylesheet was built"; exit 1; }
      if grep -oE '\.(text-[3-9]xl|rounded-(md|xl|2xl|3xl|4xl|full))\{' "$css"; then
        echo "^ these are not on the suite's scale but are being served"
        exit 1
      fi
      echo "clean: $(wc -c < "$css") bytes, no off-charter class"

mobile:
  stage: verify
  extends: [.code]
  image: $DEBIAN_IMAGE
  timeout: 30m
  cache:
    key: flutter-$FLUTTER_VERSION
    paths: [.flutter-sdk/]
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git unzip xz-utils >/dev/null
    - |
      set -eu
      if [ ! -x .flutter-sdk/flutter/bin/flutter ]; then
        archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        curl -sSfL --retry 5 -o "/tmp/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
        echo "$FLUTTER_SHA256  /tmp/$archive" | sha256sum -c -
        mkdir -p .flutter-sdk && tar -xJf "/tmp/$archive" -C .flutter-sdk
      fi
    - export PATH="$CI_PROJECT_DIR/.flutter-sdk/flutter/bin:$PATH"
    - git config --global --add safe.directory '*'
    - cd apps/mobile
    - flutter --disable-analytics >/dev/null
    - flutter pub get
    - |
      flutter gen-l10n
      if ! git diff --quiet -- lib/l10n/generated; then
        echo "Generated files differ from the .arb files. Run 'flutter gen-l10n' and commit:"
        git --no-pager diff --stat -- lib/l10n/generated
        exit 1
      fi
      echo "up to date"
    - flutter analyze
    - flutter test
    - |
      n=$(find integration_test -name '*_test.dart' 2>/dev/null | wc -l)
      echo "NOTE: $n integration test(s) need a real device and do not run here."

# The suite's brand charter, measured on ghostcal only (BRAND_SCAN_ONLY): the
# whole fleet is ghostsuite's daily job, and an MR here must not turn red on
# drift its author cannot fix. ghostsuite allows this project's job token.
charte:
  stage: verify
  extends: [.code]
  image: $UV_IMAGE
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
    - git clone --depth 1 --quiet "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/stackopsplatform/products/ghostsuite/ghostsuite.git" /tmp/charte
    - mkdir -p /tmp/produits/ghostcal
    - tar --exclude=.git -cf - . | tar -xf - -C /tmp/produits/ghostcal
    - BRAND_SCAN_DIR=/tmp/produits BRAND_SCAN_ONLY=ghostcal python3 /tmp/charte/tools/forge/check_brand_drift.py

osv-scanner:
  stage: security
  extends: [.security]
  needs: []
  image:
    name: $OSV_SCANNER_IMAGE
    entrypoint: [""]
  script:
    - /osv-scanner scan source --lockfile=uv.lock --lockfile=frontend/package-lock.json

# Working tree against the repository's allowlist, as before.
gitleaks:
  stage: security
  extends: [.security]
  needs: []
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  script:
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

images:
  stage: publish
  extends: [.code]
  needs: [quality]
  image: $BUILDAH_IMAGE
  timeout: 45m
  interruptible: false
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
    TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db:2
    TRIVY_CACHE_DIR: /tmp/trivy-cache
  script:
    - SHORT="${CI_COMMIT_SHA:0:7}"
    - buildah build --label org.opencontainers.image.revision="$CI_COMMIT_SHA" -t ghostcal:ci .
    - buildah build --label org.opencontainers.image.revision="$CI_COMMIT_SHA" -t ghostcal-frontend:ci -f frontend/Containerfile frontend
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
    - |
      set -eu
      for img in ghostcal ghostcal-frontend; do
        buildah push "$img:ci" "docker-archive:/tmp/$img.tar:$img:ci"
        trivy image --input "/tmp/$img.tar" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f "/tmp/$img.tar"
      done
    - |
      set -eu
      if [ "${CI_COMMIT_BRANCH:-}" != "$CI_DEFAULT_BRANCH" ]; then
        echo "not $CI_DEFAULT_BRANCH: built and scanned, not published"
        exit 0
      fi
      if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "GHCR_USERNAME / GHCR_TOKEN missing: built, NOT published"
        exit 1
      fi
      trap 'buildah logout --all >/dev/null 2>&1 || true' EXIT
      printf '%s' "$GHCR_TOKEN" | buildah login -u "$GHCR_USERNAME" --password-stdin ghcr.io
      for tag in "sha-$SHORT" main; do
        buildah tag ghostcal:ci "$GHCR_IMAGE:$tag"
        buildah push "$GHCR_IMAGE:$tag"
        echo "published $GHCR_IMAGE:$tag"
      done

# Dependency updates, opened as merge requests here.
renovate:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Weekly renovate" && $RENOVATE_TOKEN
  needs: []
  image:
    name: docker.io/renovate/renovate:44.132.5
    entrypoint: [""]
  timeout: 30m
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@stackops.ch>"
    LOG_LEVEL: info
  script:
    - renovate
