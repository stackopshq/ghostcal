name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# `ubuntu-latest` désigne ICI le runner de la forge, pas un runner hébergé par GitHub. Les
# jobs de test et de lint y restent : ils tournent dans l'image `runner-images:ubuntu-latest`,
# donc dans un conteneur jetable, et ils n'ont besoin d'aucun moteur de conteneurs.
#
# Le job `image` fait exception et demande `[self-hosted, linux, x64]`. Ces étiquettes
# existent depuis le 2026-08-27 : elles désignent `core-run-01-host-1`, un second exécutant
# enregistré au niveau de l'organisation `stackops` et déclaré SANS image. Le job s'exécute
# donc directement sur la VM `core-run-01`, sous l'utilisateur `gitea-runner-host` (uid 985),
# où `podman 5.8.2` est installé en rootless. Mesuré : `/run/.containerenv` absent,
# `podman build` aboutit.
#
# Ne pas déplacer les autres jobs ici. Sur cet exécutant il n'y a pas de bac à sable : un job
# écrit sur la VM elle-même, et sa capacité est de 1, donc tout ce qui y passe sérialise le
# reste. Un test qui marche dans un conteneur jetable n'a rien à y gagner.
#
# `host` n'est pas un contournement : cette étiquette-là appartient à l'ANCIEN exécutant et
# atterrit dans le conteneur du runner, pas sur la VM.

# uv est épinglé, pas « latest ». `setup-uv` sans version demande à l'API GitHub
# quelle est la dernière release, anonymement : l'exécutant de la forge n'a pas de
# jeton GitHub, et son IP publique est partagée. Le 2026-08-29 cette requête a rendu
# `API rate limit exceeded` et fait échouer un job sur `main` qui venait de passer
# sur la branche, à vingt minutes d'écart et sans qu'une ligne de code ait changé.
env:
  UV_VERSION: "0.11.8"

jobs:
  quality:
    runs-on: ubuntu-latest

    # Two thirds of the backend suite is integration tests, and without a database they skip —
    # which CI reports as success. RLS, invitations and key rotation are only covered here.
    #
    # Postgres arrive par `services:`, et NON par un `podman run` lancé à la main.
    #
    # Le commentaire précédent justifiait ce contournement par l'absence du client `docker`
    # sur le runner. C'est faux, mesuré le 2026-08-27 dans l'image du runner elle-même
    # (`docker.gitea.com/runner-images:ubuntu-latest`) : `docker` y est présent, et c'est
    # `podman` qui est absent.
    #
    # Attention à ne pas en tirer que les jobs pourraient construire des images avec
    # `docker` : mesuré le même jour par une sonde jetable, le client est bien là (29.6.2)
    # et le job tourne en uid 0, mais AUCUN démon n'est joignable depuis le conteneur de
    # job. `/var/run/docker.sock` y est un répertoire vide, pas une socket, et tout appel
    # rend `permission denied while trying to connect to the docker API`. Si `services:`
    # fonctionne malgré ça, c'est que les conteneurs de service sont créés par le runner
    # côté hôte, et non depuis le job.
    #
    # Le contournement était donc devenu la panne, le job mourant
    # sur `podman: command not found` (code 127) à sa toute première étape, avant d'exécuter
    # le moindre test. Quatre autres produits de la gamme sont servis par `services:`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghostcal
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: ghostcal
        # Pas de `ports:`, et ce n'est pas un oubli : `core-run-01` est partagé par toute la
        # forge, donc publier 5432 sur l'hôte fait que le premier job qui le tient tue tous
        # les autres sur `bind: address already in use`. Un service reste joignable par son
        # NOM sur le réseau du job, sans rien publier.
        #
        # `--health-cmd` remplace la boucle `pg_isready` que faisait l'ancienne étape : le
        # runner ne démarre aucune étape tant que la sonde n'est pas verte. Elle s'exécute
        # DANS le conteneur postgres, qui porte `pg_isready` ; le conteneur de job, lui,
        # ne l'a pas.
        options: >-
          --health-cmd "pg_isready -U ghostcal -d ghostcal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `postgres`, et non `localhost` : les étapes tournent DANS le conteneur de job, où
      # `localhost` désigne ce conteneur et jamais le service.
      GHOSTCAL_DATABASE_ADMIN_URL: postgresql+asyncpg://ghostcal:ci-admin-password@postgres:5432/ghostcal
      GHOSTCAL_DATABASE_URL: postgresql+asyncpg://ghostcal_app:ci-app-password@postgres:5432/ghostcal
      # Reste sur `localhost` à dessein : aucun service Redis n'est déclaré, et rien ne s'y
      # connecte. `tests/conftest.py` ne fait qu'un `setdefault` pour que la validation de
      # configuration passe. Ne pas le pointer sur un service qui n'existe pas.
      GHOSTCAL_REDIS_URL: redis://localhost:6379/0
      # Throwaway values for a throwaway database. `environment` stays development, so the
      # placeholder-secret validator does not apply; these never leave the runner. Annotated
      # line-by-line rather than allowlisting this file, so a real secret added here still fails.
      GHOSTCAL_SECRET_KEY: ci-secret-key-at-least-32-characters-long # gitleaks:allow
      GHOSTCAL_TOKEN_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars-long # gitleaks:allow
      # Skipping the integration tests here would be a green build that tested none of them.
      GHOSTCAL_TESTS_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      # Le client psql n'est pas dans l'image du runner (vérifié le 2026-08-27 : ni `psql`,
      # ni `pg_isready`). L'ancienne étape s'en passait en appelant le psql du conteneur via
      # `podman exec` ; sans podman, il faut le client ici. Le serveur est en 16, le client
      # d'Ubuntu 24.04 aussi.
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Order matters, and mirrors compose: the role exists before the schema does. Migrations
      # grant EXECUTE on their SECURITY DEFINER functions conditionally — `IF EXISTS (role
      # ghostcal_app)` — so migrating first silently skips every one of those grants and the app
      # role then cannot call `provision_account` at all. The default privileges this sets cover
      # the tables the migrations go on to create.
      #
      # Joué par le psql installé plus haut, contre le service `postgres`. Le script est passé
      # par `-f` sur un vrai chemin, et non plus sur stdin : le détour par stdin n'existait que
      # pour alimenter le psql d'un conteneur distant. Il garde son `\set` et son
      # `:'app_password'`, qui imposent psql et interdisent de le rejouer avec un autre client.
      - name: Provision the application role
        run: |
          psql "postgresql://ghostcal:ci-admin-password@postgres:5432/ghostcal" \
            -v app_password="ci-app-password" \
            -f scripts/bootstrap_roles.sql

      - name: Create the schema (admin role)
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      # Pas d'étape d'arrêt : le runner détruit lui-même les conteneurs de `services:` à la fin
      # du job, quelle qu'en soit l'issue. C'est précisément ce que le `podman run` à la main
      # avait fait perdre, et que cette étape rattrapait.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the gitleaks binary directly (the marketplace action needs a paid licence for
      # private org repos). Scans the working tree against the repo's allowlist.
      - name: Scan secrets (gitleaks)
        run: |
          version=8.21.2
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors -A 'ghostcal-ci' "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

      # Run the osv-scanner binary directly, for the same reason gitleaks is run that way above:
      # the marketplace action is a *Docker* action, and the runner has no docker CLI to pull its
      # image with. The published checksums are verified — the release serves a SHA256SUMS file,
      # so there is no reason to trust the download blindly.
      - name: Scan dependencies (osv-scanner)
        run: |
          version=2.3.8
          base="https://github.com/google/osv-scanner/releases/download/v${version}"
          curl -sSLf --retry 5 --retry-delay 3 --retry-all-errors -A 'ghostcal-ci' -o osv-scanner_linux_amd64 "${base}/osv-scanner_linux_amd64"
          curl -sSLf --retry 5 --retry-delay 3 --retry-all-errors -A 'ghostcal-ci' -o osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
          sha256sum --ignore-missing -c osv-scanner_SHA256SUMS
          chmod +x osv-scanner_linux_amd64
          ./osv-scanner_linux_amd64 scan source \
            --lockfile=uv.lock \
            --lockfile=frontend/package-lock.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # `next build` type-checks only what the app imports, so an error inside a test file
      # passes lint, vitest and build alike. This step is the one that sees them.
      - name: Type check (tsc)
        run: npm run type-check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

      # The only step that looks at what is actually SERVED. `scale.test.ts` reads the source and
      # refuses off-charter classes there; it cannot see the stylesheet, which is emitted later and
      # from a wider net -- Tailwind v4 discovers its own sources, test files included. On
      # 2026-08-31 that put `.text-3xl` and `.text-4xl` into production CSS because the test
      # FORBIDDING them names them in its documentation. Weightless, and it made the shipped sheet
      # say the opposite of the truth to anyone auditing it.
      - name: No off-charter class in the served stylesheet
        run: |
          css=$(find .next -name '*.css' -path '*static*' | head -1)
          test -n "$css" || { echo "no stylesheet was built"; exit 1; }
          # The charter stops at 2xl and has four radii; anything above is Tailwind's own value.
          if grep -oE '\.(text-[3-9]xl|rounded-(md|xl|2xl|3xl|4xl|full))\{' "$css"; then
            echo "^ these are not on the suite's scale but are being served"
            exit 1
          fi
          echo "clean: $(wc -c < "$css") bytes, no off-charter class"

  image:
    runs-on: [self-hosted, linux, x64]
    needs: [quality]
    # Scoped to this job rather than the workflow: every other job here only
    # needs to read the repository, and a token that can write packages has
    # no business being present while third-party actions run.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image (Podman)
        run: podman build -t ghostcal:ci .

      # The frontend is a second image because it is a second runtime. Until
      # 2026-08-12 this job built only the backend, so `npm run build` in the
      # quality job proved the interface compiled and then threw it away -- and
      # deploying ghostcal meant deploying an API with no interface in front of
      # it, which is exactly what was found running in production.
      - name: Build frontend image (Podman)
        run: podman build -t ghostcal-frontend:ci -f frontend/Containerfile frontend

      # osv-scanner covers uv.lock and package-lock.json — our dependencies, not the operating
      # system underneath them. Everything in the base layer (OpenSSL, zlib, the Debian userland)
      # was unscanned, which is the largest surface in the deployed artefact.
      #
      # Fails on HIGH/CRITICAL with a fix available. Vulnerabilities with no upstream fix are
      # reported but do not fail: a build that cannot be made green teaches people to ignore it.
      #
      # Scanned from an archive rather than by tag: the image lives in podman's store, and the
      # Trivy action resolves an `image-ref` through the Docker daemon, where it does not exist.
      #
      # Written under RUNNER_TEMP, which the runner empties between jobs, rather than /tmp, which
      # it does not. `podman save` onto an existing docker-archive tries to add to it and fails
      # with "docker-archive doesn't support modifying existing images" — so on a long-lived
      # runner the step worked exactly once per machine and failed on every run afterwards.
      - name: Export image for scanning
        run: podman save -o "${RUNNER_TEMP}/ghostcal-ci.tar" ghostcal:ci

      - name: Export frontend image for scanning
        run: podman save -o "${RUNNER_TEMP}/ghostcal-frontend-ci.tar" ghostcal-frontend:ci

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # ghcr.io rate-limits Trivy DB pulls and the job died on it twice in a
          # row on 2026-08-13 — a scan that fails on its own database download
          # blocks every deploy while saying nothing about the image. The list
          # is ordered fallbacks: AWS's public mirror first (no rate limit),
          # ghcr second.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db:2
        with:
          # `setup-trivy`, appelée par cette action, fait un `actions/checkout` du dépôt
          # `aquasecurity/trivy` SUR github.com, avec `github.token` par défaut. Ici ce jeton
          # est celui de la forge : github.com le refuse, git redemande un nom d'utilisateur
          # et l'étape meurt sur « could not read Username ». Constaté le 2026-08-27, après
          # les deux `podman build` — les images étaient construites, le job rouge.
          # `GH_COM_TOKEN` est le secret d'organisation déjà utilisé pour atteindre github.com.
          token-setup-trivy: ${{ secrets.GH_COM_TOKEN }}
          input: ${{ runner.temp }}/ghostcal-ci.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db:2
        with:
          # `setup-trivy`, appelée par cette action, fait un `actions/checkout` du dépôt
          # `aquasecurity/trivy` SUR github.com, avec `github.token` par défaut. Ici ce jeton
          # est celui de la forge : github.com le refuse, git redemande un nom d'utilisateur
          # et l'étape meurt sur « could not read Username ». Constaté le 2026-08-27, après
          # les deux `podman build` — les images étaient construites, le job rouge.
          # `GH_COM_TOKEN` est le secret d'organisation déjà utilisé pour atteindre github.com.
          token-setup-trivy: ${{ secrets.GH_COM_TOKEN }}
          input: ${{ runner.temp }}/ghostcal-frontend-ci.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Publish only what has passed quality, the vulnerability scan, and only
      # from main. Until 2026-08-11 nothing was published at all, so deploying
      # ghostcal meant cloning the source onto the target host and building
      # there -- which makes "what is running" a question nobody can answer
      # from a registry.
      #
      # Tagged by commit SHA, never `latest`: an immutable tag is what lets an
      # operator say which build is deployed, and roll back to a specific one.
      # `main` moves and is a convenience, not something to deploy from.
      - name: Publish image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # `ghcr.io/stackopshq/…` en dur, et non `github.repository` : sur la forge cette
          # variable vaut `stackops/ghostcal`, un espace de noms qui n'existe pas sur
          # GitHub. Le nom est le même vu d'ici ou du miroir, autant l'écrire.
          IMAGE: ghcr.io/stackopshq/ghostcal
        run: |
          set -euo pipefail
          # `GITHUB_TOKEN` est ici un jeton de la forge : ghcr.io le refuse en 403.
          # Les identifiants ghcr sont des secrets d'organisation `stackops`.
          printf '%s' "${GHCR_TOKEN}" \
            | podman login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin
          SHORT="$(git rev-parse --short HEAD)"
          podman tag ghostcal:ci "${IMAGE}:sha-${SHORT}"
          podman tag ghostcal:ci "${IMAGE}:main"
          podman push "${IMAGE}:sha-${SHORT}"
          podman push "${IMAGE}:main"
          echo "published ${IMAGE}:sha-${SHORT}"
          # Le frontend part dans LE MÊME paquet, sous une balise suffixée,
          # plutôt que dans un paquet `-frontend` séparé.
          #
          # Deux paquets, c'était deux épinglages à monter ensemble sans que
          # rien ne l'impose — et un frontend en avance sur son API est une
          # panne silencieuse. Ici les deux balises dérivent du même SHORT :
          # elles ne peuvent pas diverger, et un seul épinglage côté Ansible
          # suffit à décrire les deux.
          #
          # Pas une image unique pour autant : app, worker et beat partagent
          # une image parce qu'ils partagent un interpréteur, et celui-ci est
          # Node, pas Python. Les fondre doublerait la surface d'attaque des
          # deux pour qu'ils partagent une balise — ce que ce découpage donne
          # déjà, sans le coût.
          podman tag ghostcal-frontend:ci "${IMAGE}:sha-${SHORT}-frontend"
          podman tag ghostcal-frontend:ci "${IMAGE}:main-frontend"
          podman push "${IMAGE}:sha-${SHORT}-frontend"
          podman push "${IMAGE}:main-frontend"
          echo "published ${IMAGE}:sha-${SHORT}-frontend"
          podman logout "${REGISTRY}" || true
