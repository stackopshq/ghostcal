<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Une seule forme, pas deux empilées. Le calendrier est creusé dans le
       fantôme : ses deux anneaux dépassent en haut, sa barre de titre le coupe,
       et six pastilles font la grille. La version précédente posait un
       calendrier filaire au centre d'un fantôme filaire — des traits de 20 px
       qui se brouillaient dès 32 px, la taille d'un favicon. Une silhouette
       pleine à creux tient jusqu'à 16 px. Même construction que ghostmail. -->
  <defs>
    <linearGradient id="g" x1="256" y1="48" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CFBFF"/>
      <stop offset="0.5" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#0E8FA8"/>
    </linearGradient>
  </defs>

  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#g)" d="
      M 256 44
      C 152 44 84 118 84 220
      L 84 434
      C 84 462 114 476 133 456
      L 167 420
      C 180 407 199 407 212 420
      L 237 446
      C 248 458 264 458 275 446
      L 300 420
      C 313 407 332 407 345 420
      L 379 456
      C 398 476 428 462 428 434
      L 428 220
      C 428 118 360 44 256 44
      Z

      M 148 200
      L 148 186
      C 148 174 158 164 170 164
      L 342 164
      C 354 164 364 174 364 186
      L 364 200
      Z

      M 148 232
      L 148 336
      C 148 348 158 358 170 358
      L 342 358
      C 354 358 364 348 364 336
      L 364 232
      Z

      M 206 267 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0 Z
      M 306 267 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0 Z
      M 206 325 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0 Z
      M 306 325 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0 Z
  "/>

  <!-- Les deux anneaux de reliure, posés par-dessus : ils doivent rester pleins
       dans la zone creusée de la barre de titre, donc pas d'evenodd ici. -->
  <g fill="url(#g)">
    <rect x="200" y="126" width="24" height="60" rx="12"/>
    <rect x="288" y="126" width="24" height="60" rx="12"/>
  </g>
</svg>
