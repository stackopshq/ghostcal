[package]
name = "rust_lib_ghostcal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.23.1"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.4.3"
# Le cœur commun de la suite, pris **directement** et non à travers son binding UniFFI.
#
# Deux générateurs coexistent au-dessus du même cœur : UniFFI pour les extensions natives
# — remplissage automatique iOS et Android, qui ne peuvent pas être en Flutter — et
# `flutter_rust_bridge` pour l'application. Les empiler l'un sur l'autre aurait ajouté une
# frontière sans rien apporter ; ils sont donc frères, chacun au-dessus de `ghost-crypto`.
#
# Chemin relatif assumé, comme pour l'XCFramework : la suite vit à côté du produit. La
# variable `GHOSTSUITE` sert au script de construction, pas à Cargo, qui n'en lit pas.
ghost-crypto = { path = "../../../../suite/crates/ghost-crypto" }
serde_json = "1.0.151"
# Web-format envelopes (src/compat_web.rs): same versions as ghost-crypto, so nothing
# is compiled twice.
aes-gcm = "0.10.3"
hkdf = "0.12.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
