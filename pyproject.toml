[project]
name = "ghostcal"
version = "0.1.0"
description = "GhostCal — fast, correct scheduling. Calendly/Cal.com alternative."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kevin Allioli", email = "kevin@stackops.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "celery[redis]>=5.6.3",
    "defusedxml>=0.7.1",
    "fastapi>=0.138.1",
    # Déclaré explicitement alors que SQLAlchemy le tire déjà. Son marqueur de
    # plateforme nomme `aarch64` mais **pas `arm64`**, que déclare macOS Apple
    # Silicon : chaque `uv sync` l'y élaguait donc, et les tests d'intégration
    # passaient de « sautés » à « en erreur ».
    #
    # C'est le filet à trois états qui se casse en silence. « Vert », « rouge »
    # et « je n'ai pas pu regarder » sont trois réponses distinctes ; une erreur
    # d'import les réduit à du bruit, et deux personnes y ont perdu du temps en
    # croyant à une ligne de base rouge.
    #
    # Sans effet sur Linux, où le marqueur amont l'installait déjà.
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "icalendar>=6.0.0",
    "itsdangerous>=2.2.0",
    "pillow>=12.0.0",
    "prometheus-client>=0.25.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    # TOTP (RFC 6238). Bibliothèque éprouvée plutôt qu'une troncature
    # dynamique et un base32 écrits ici : c'est court, et c'est précisément le
    # genre de code court qu'on relit sans voir l'erreur.
    "pyotp>=2.9.0",
    "python-dateutil>=2.9.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # The manifest is served verbatim by the app, so PyYAML is only needed to *check* it in tests —
    # declared here rather than relied on transitively.
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "types-python-dateutil>=2.9.0",
    "time-machine>=3.2.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ghostcal"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ghostcal"]

[[tool.mypy.overrides]]
module = ["celery.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the cached async engine stays bound to a live loop
# across tests (otherwise reuse hits "Event loop is closed").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=ghostcal --cov-report=term-missing --strict-markers"
markers = [
    "integration: requires a live PostgreSQL (skipped when unreachable)",
]

[tool.coverage.run]
source = ["ghostcal"]
branch = true
